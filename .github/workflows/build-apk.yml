name: Build Android APK

on:
  workflow_dispatch:        # 在 Actions 页面手动点一下即可出包
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at the SDK
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 仓库不提交二进制 wrapper jar，这里在云端下载 Gradle 并生成
      - name: Download Gradle 8.9 distribution
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "GRADLE_BIN=$PWD/gradle-8.9/bin/gradle" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper (jar is not committed to repo)
        run: $GRADLE_BIN wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chengfa-collab-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 正式签名版：在仓库 Settings → Secrets 配置 KEYSTORE_BASE64 / KEY_ALIAS /
      # KEYSTORE_PASSWORD / KEY_PASSWORD 后，取消下面 job 的注释即可。
