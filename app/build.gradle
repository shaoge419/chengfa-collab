plugins {
    id 'com.android.application'
}

// 强制所有 Kotlin 构件统一版本，避免 kotlin-stdlib 与老旧 kotlin-stdlib-jdk7/jdk8 重复类冲突
configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}

android {
    namespace 'com.chengfaedu.collabsync'
    compileSdk 34

    defaultConfig {
        applicationId "com.chengfaedu.collabsync"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debuggable APK can be installed directly for internal testing
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}
